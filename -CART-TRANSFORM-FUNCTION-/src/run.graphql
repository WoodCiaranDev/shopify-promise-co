query Input {
  cart {
    lines {
      id
      quantity
      cost {
        amountPerQuantity {
          amount
          currencyCode
        }
      }
      merchandise {
        ... on ProductVariant {
          id
          product {
            id
            title
          }
        }
      }
      bundleId: attribute(key: "_bundle_id") {
        value
      }
      bundleRole: attribute(key: "_bundle_role") {
        value
      }
      birthstoneOne: attribute(key: "Birthstone One") {
        value
      }
      birthstoneTwo: attribute(key: "Birthstone Two") {
        value
      }
      engraving: attribute(key: "Engraving") {
        value
      }
    }
  }
  presentmentCurrencyRate
}
